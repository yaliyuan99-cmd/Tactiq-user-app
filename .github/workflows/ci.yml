# Checks that must pass before the app is published.
#
# Two jobs on purpose. `checks` is fast and runs on every push: lint, types,
# unit tests and a production build. `browser` is slower because it downloads a
# browser, so it runs separately and uploads its report when it fails — a red
# end-to-end run should leave behind enough to diagnose it without a rerun.
#
# Failures here are meant to be meaningful: nothing is allowed to continue on
# error, and no step swallows a non-zero exit.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: the older answer is not
# worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI cannot drift from local.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      # Runs the type-check again as part of `build`, which is deliberate: it is
      # the same gate the deploy uses, so a green CI means a deployable tree.
      - name: Production build
        run: npm run build

  browser:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only Chromium: the suite runs a desktop and a mobile project, both on
      # Chromium, so downloading the other engines would cost minutes for
      # nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Starts its own dev server (see playwright.config.ts webServer).
      - name: End-to-end and axe checks
        run: npm run test:e2e

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
